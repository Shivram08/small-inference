[project]
name = "small-inference"
version = "0.1.0"
description = "A minimal LLM serving engine built from scratch (Qwen2, paged KV, Triton decode, continuous batching, INT8 KV)"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.14.1",
    "triton==3.8.0",
    "transformers==5.19.0",
    "safetensors==0.8.0",
    "huggingface-hub==2.2.0",
    "numpy==2.5.3",
    "matplotlib==3.11.2",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

# torch comes from the CUDA 13.0 wheel index. The driver (617.42) supports CUDA 13.4,
# and CUDA 13 still targets Ampere (sm_86). vLLM gets its own venv in Phase 6.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
